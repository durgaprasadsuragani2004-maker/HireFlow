services:
  # HireFlow Backend API Web Service
  - type: web
    name: hireflow-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-db
          property: connectionString
      - key: STORAGE_TYPE
        value: s3
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # HireFlow Frontend Next.js Web Service
  - type: web
    name: hireflow-client
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  # Managed PostgreSQL Instance
  - name: hireflow-db
    databaseName: hireflow
    user: postgres
    plan: starter
